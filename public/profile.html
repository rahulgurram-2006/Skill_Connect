<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="image/png" href="images/ifavro.png">
<title>Profile - Skill Connect</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<!-- Navbar -->


<nav class="bg-white shadow p-4 flex items-center justify-between">

<!-- Left Logo -->
<div class="flex items-center gap-2">
<img src="images/logo.png" alt="Skill Connect Logo" class="h-10">
    <h1 class="font-bold text-lg">Skill Connect</h1>
</div>


<!-- Middle Navigation -->
<div class="flex gap-8 font-medium">
<a href="index.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
🏠 Home
</a>

<a href="events.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
📅 Events
</a>

<a href="submit.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
➕ Submit Event
</a>

<a href="participation.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
📊 My Participations
</a>

<a href="profile.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
👤 Profile
</a>

</div>


<!-- Right Login -->
<div>
<a href="login.html"
class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 hover:scale-105 transition duration-200 inline-block">
Login / Register
</a>

</div>

</nav>


<!-- Profile Section -->

<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

<h2 class="text-2xl font-bold mb-6">Profile Settings</h2>

<div class="flex items-center gap-6 mb-6">

<img
src="https://via.placeholder.com/100"
class="rounded-full w-24 h-24"
/>

<div>
<input type="file" class="text-sm">
<p class="text-gray-500 text-sm">
Upload profile photo
</p>
</div>

</div>


<!-- Profile Form -->

<form class="grid grid-cols-2 gap-4">

<input
type="text"
placeholder="Full Name"
class="border p-3 rounded"
/>

<input
type="email"
placeholder="Email"
class="border p-3 rounded"
/>

<input
type="text"
placeholder="College Name"
class="border p-3 rounded"
/>

<input
type="text"
placeholder="Branch"
class="border p-3 rounded"
/>

<input
type="text"
placeholder="Year"
class="border p-3 rounded"
/>

<input
type="text"
placeholder="Skills"
class="border p-3 rounded"
/>

</form>

<button
class="mt-6 bg-purple-600 text-white px-6 py-3 rounded-lg">

Save Changes

</button>

</div>

</body>
</html>
