<!-- Register Section -->

<div class="flex items-center justify-center mt-16">

<div class="bg-white p-10 rounded-xl shadow-lg w-[450px] hover:shadow-xl transition">

<h2 class="text-2xl font-bold text-center mb-6">
Student Registration
</h2>


<form class="space-y-4">


<input type="text"
placeholder="Full Name"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<input type="email"
placeholder="Email Address"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<input type="tel"
placeholder="Phone Number"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<input type="text"
placeholder="College Name"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">

<input type="text"
placeholder="College ID"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">

<input type="text"
placeholder="Branch / Department"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<input type="password"
placeholder="Create Password"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<input type="password"
placeholder="Confirm Password"
class="w-full border p-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">


<button
class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 hover:scale-105 transition duration-200">

Register

</button>

</form>


<p class="text-center text-sm mt-4 text-gray-600">

Already have an account?

<a href="login.html"
class="text-purple-600 font-semibold hover:underline">
Login
</a>

</p>
