<h1 class="font-bold text-lg">

<!-- Navigation -->

<div class="flex gap-8 font-medium">

<a href="index.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
🏠 Home
</a>

<a href="events.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">
📅 Events
</a>

<a href="submit.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">

<a href="participation.html"
class="px-3 py-2 rounded-lg hover:bg-purple-100 hover:text-purple-700 hover:scale-110 transition duration-200 inline-block">

<a href="profile.html"

<div>

<a href="login.html"
class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 hover:scale-105 transition duration-200 inline-block">
Login / Register
</a>

</div>

<!-- Login Form -->

<div class="flex items-center justify-center mt-24">

<div class="bg-white p-8 rounded-xl shadow-lg w-96">

<h2 class="text-2xl font-bold text-center mb-6">
Login to Skill Connect
</h2>


<input
type="email"
placeholder="Email Address"
class="border p-3 w-full mb-4 rounded"
/>


<input
type="password"
placeholder="Password"
class="border p-3 w-full mb-4 rounded"
/>


<button
class="bg-purple-600 text-white w-full py-3 rounded hover:bg-purple-700">

Login

</button>


<p class="text-center text-sm text-gray-500 mt-4">

Don't have an account?

<a href="register.html" class="text-purple-600 font-semibold">
Register
</a>

</p>

</div>
